project:
  type: website
  render:
    - "*.qmd"
    - "unidad*/*.qmd"
    - "!**/notebooks/"
  # No definimos output-dir: Quarto renderiza en _site/ (que va en .gitignore).
  # El sitio final se publica en la rama gh-pages, no en main.

website:
  title: "Traajo Final"
  description: "Trabajo Final de Tesis"
  page-navigation: true
  reader-mode: true
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Inicio
      - href: unidad0/notas.qmd
        text: Unidad 0
      # - href: unidad1/notas.qmd
      #   text: Unidad 1
    right:
      - icon: github
        href: https://github.com/SantiagoAFerreyra/AI-FFM

  sidebar:
    style: "docked"
    search: true
    background: dark
    contents:
      - text: "---"
      - section: "RAFA 2026"
        contents:
          - unidad0/notas.qmd
      #    - unidad0/calendario.qmd
      #    - unidad0/presentacion.qmd
      # - text: "---"
      # - section: "1. Fundamentos de IA"
      #   contents:
      #     - unidad1/notas.qmd
      #     - unidad1/presentacion.qmd

format:
  html:
    theme: darkly
    toc: true
    number-sections: true
    css: styles.css

execute:
  freeze: auto  # evita re-ejecutar código si el .qmd no cambió
