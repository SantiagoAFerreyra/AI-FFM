on:
  push:
    branches: main
  workflow_dispatch: {}

name: Publicar sitio Quarto

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repositorio
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Verificar Quarto
        run: |
          quarto --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias (si el sitio ejecuta código)
        run: python -m pip install jupyter pyyaml -r requirements.txt

      - name: Renderizar sitio
        run: quarto render --log-level debug

      - name: Publicar en gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: "false"
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_EMAIL: ${{ github.actor }}@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
